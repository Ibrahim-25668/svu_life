<!-- ================= Contact Form ================= -->
<div class="container my-5">

    <h2 class="text-center mb-4">اتصل بنا</h2>

    <!-- Success Alert -->
    <div id="successMessage" class="alert alert-success text-center d-none">
        تم إرسال الرسالة بنجاح ✅
    </div>

    <form id="contactForm">

        <div class="mb-3">
            <label class="form-label">الاسم</label>
            <input type="text" class="form-control" id="name">
            <small class="text-danger d-none" id="nameError">الرجاء إدخال الاسم</small>
        </div>

        <div class="mb-3">
            <label class="form-label">البريد الإلكتروني</label>
            <input type="email" class="form-control" id="email">
            <small class="text-danger d-none" id="emailError">الرجاء إدخال بريد صحيح</small>
        </div>

        <div class="mb-3">
            <label class="form-label">الموضوع</label>
            <input type="text" class="form-control" id="subject">
            <small class="text-danger d-none" id="subjectError">الرجاء إدخال الموضوع</small>
        </div>

        <div class="mb-3">
            <label class="form-label">الرسالة</label>
            <textarea class="form-control" rows="5" id="message"></textarea>
            <small class="text-danger d-none" id="messageError">الرجاء إدخال الرسالة</small>
        </div>

        <button type="submit" class="btn btn-primary w-100">إرسال</button>

    </form>

</div>

<!-- ================= Validation JS ================= -->
<script>

document.getElementById("contactForm").addEventListener("submit", function(e) {

    e.preventDefault();

    let isValid = true;

    // Inputs
    let name = document.getElementById("name");
    let email = document.getElementById("email");
    let subject = document.getElementById("subject");
    let message = document.getElementById("message");

    // Errors
    let nameError = document.getElementById("nameError");
    let emailError = document.getElementById("emailError");
    let subjectError = document.getElementById("subjectError");
    let messageError = document.getElementById("messageError");

    // Reset
    nameError.classList.add("d-none");
    emailError.classList.add("d-none");
    subjectError.classList.add("d-none");
    messageError.classList.add("d-none");

    // Name validation
    if (name.value.trim() === "") {
        nameError.classList.remove("d-none");
        isValid = false;
    }

    // Email validation
    let emailPattern = /^[^ ]+@[^ ]+\.[a-z]{2,3}$/;
    if (!email.value.match(emailPattern)) {
        emailError.classList.remove("d-none");
        isValid = false;
    }

    // Subject validation
    if (subject.value.trim() === "") {
        subjectError.classList.remove("d-none");
        isValid = false;
    }

    // Message validation
    if (message.value.trim() === "") {
        messageError.classList.remove("d-none");
        isValid = false;
    }

    // Success
    if (isValid) {
        document.getElementById("successMessage").classList.remove("d-none");
        document.getElementById("contactForm").reset();
    }

});

</script>
