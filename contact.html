    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

    <link rel="stylesheet" href="assets/css/style.css">

    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo&display=swap" rel="stylesheet">

    <style>

</head>

<body>
    <main class="flex-grow-1">
        <!-- Navbar -->
        <nav class="navbar navbar-expand-lg navbar-dark">
            <div class="container">

                <a class="navbar-brand fw-bold" href="index.html">
                    <img src="assets/img/logo.png" alt="SVU Life Logo" width="30" height="30" class="rounded-circle">
                    SVU
                    Life
                </a>

                <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="nav">
                    <ul class="navbar-nav ms-auto">

                        <li class="nav-item"><a class="nav-link" href="index.html">الرئيسية</a></li>
                        <li class="nav-item"><a class="nav-link" href="events.html">الفعاليات</a></li>
                        <li class="nav-item"><a class="nav-link" href="about.html">عن الموقع</a></li>
                        <li class="nav-item"><a class="nav-link active" href="contact.html">اتصل بنا</a></li>

                    </ul>
                </div>

            </div>
        </nav>

        <!-- Contact Form -->
        <div class="container my-5">

            <h2 class="text-center mb-4">اتصل بنا</h2>

            <!-- Success Alert -->
            <div id="successMessage" class="alert alert-success text-center d-none">
                تم إرسال الرسالة بنجاح
            </div>

            <div class="row">
                <div class="col-md-6 mx-auto">
                    <form id="contactForm">

                        <div class="mb-3">
                            <label class="form-label">الاسم</label>
                            <input type="text" class="form-control" id="name">
                            <small class="text-danger d-none" id="nameError">الرجاء إدخال الاسم</small>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">البريد الإلكتروني</label>
                            <input type="email" class="form-control" id="email">
                            <small class="text-danger d-none" id="emailError">الرجاء إدخال بريد صحيح</small>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">الموضوع</label>
                            <input type="text" class="form-control" id="subject">
                            <small class="text-danger d-none" id="subjectError">الرجاء إدخال الموضوع</small>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">الرسالة</label>
                            <textarea class="form-control" rows="3" id="message"></textarea>
                            <small class="text-danger d-none" id="messageError">الرجاء إدخال الرسالة</small>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">إرسال</button>

                    </form>
                </div>
            </div>
        </div>

    </main>
